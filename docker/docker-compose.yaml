services:
  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    env_file:
      - ../.env   
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - backend

networks:
  backend:
    driver: bridge